{% extends "base.html" %}

{% block content %}

<div class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h2>
                {{ template.name }}
            </h2>

            <div class="text-muted">
                Код: {{ template.code }}
            </div>
        </div>

        <button
            type="button"
            class="btn btn-primary"
            id="addVersionButton"
        >
            Добавить версию
        </button>

    </div>


    {% if template.description %}

        <div class="card mb-4">

            <div class="card-body">

                <h5 class="card-title">
                    Описание
                </h5>

                <p class="card-text mb-0">
                    {{ template.description }}
                </p>

            </div>

        </div>

    {% endif %}


    <div class="card">

        <div class="card-header">

            <h5 class="mb-0">
                Версии макета
            </h5>

        </div>


        <div class="card-body p-0">

            <div
                id="versionsContainer"
                class="table-responsive"
            >

                <div class="p-4 text-muted">
                    Загрузка версий...
                </div>

            </div>

        </div>

    </div>


    <div class="mt-3">

        <a
            href="{{ url_for('templates.list_templates') }}"
            class="btn btn-secondary"
        >
            Назад к макетам
        </a>

    </div>

</div>


<!-- Modal -->

<div
    class="modal fade"
    id="addVersionModal"
    tabindex="-1"
    aria-hidden="true"
>

    <div class="modal-dialog modal-lg">

        <div class="modal-content">


            <div class="modal-header">

                <h5 class="modal-title">
                    Добавить версию макета
                </h5>

                <button
                    type="button"
                    class="btn-close"
                    data-bs-dismiss="modal"
                ></button>

            </div>


            <div class="modal-body">

                <div
                    id="availableFilesContainer"
                >

                    <div class="text-muted">
                        Загрузка файлов...
                    </div>

                </div>

            </div>


            <div class="modal-footer">

                <button
                    type="button"
                    class="btn btn-secondary"
                    data-bs-dismiss="modal"
                >
                    Отмена
                </button>

                <button
                    type="button"
                    class="btn btn-primary"
                    id="createVersionButton"
                    disabled
                >
                    Добавить версию
                </button>

            </div>


        </div>

    </div>

</div>


<script>

    const templateId = {{ template.id }};

</script>

<script
    src="{{ url_for(
        'static',
        filename='js/certificates/cert_templates/template_detail.js'
    ) }}"
></script>

{% endblock %}
