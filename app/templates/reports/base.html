<!doctype html>
<html lang="ru">

<head>

    <meta charset="utf-8">

    <title>
        {% block title %}
            Отчеты
        {% endblock %}
    </title>


    <meta name="viewport" content="width=device-width, initial-scale=1">


    <!-- Bootstrap если уже используется в проекте -->
    <link 
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >


    <style>

        .report-summary {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }


        .summary-item {

            border: 1px solid #ddd;
            border-radius: 6px;

            padding: 10px 15px;

            min-width: 180px;

            background: #f8f9fa;

        }


        .summary-item strong {

            display: block;

            margin-bottom: 5px;

        }


        .report-container {

            padding: 20px;

        }


        table th {

            white-space: nowrap;

        }


        tr.table-secondary td {

            font-style: italic;

        }


    </style>


    {% block head %}

    {% endblock %}


</head>


<body>


<div class="container-fluid report-container">


    <!-- Заголовок отчета -->

    <div class="d-flex justify-content-between align-items-center mb-3">


        <h2>

            {% block header %}

            {% endblock %}

        </h2>


        <div>

            {% block actions %}

            {% endblock %}

        </div>


    </div>



    <!-- Фильтры -->

    <div class="card mb-3">

        <div class="card-body">


            {% block filters %}

            {% endblock %}


        </div>

    </div>



    <!-- Основное содержимое отчета -->

    {% block content %}

    {% endblock %}



</div>



{% block scripts %}

{% endblock %}


</body>

</html>
