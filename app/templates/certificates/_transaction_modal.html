<!-- /app/templates/certificates/_transaction_modal.html -->

<div class="modal fade" id="transactionModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <form id="transactionForm">
        <div class="modal-header">
          <h5 class="modal-title">Создание транзакции</h5>
          <button type="button"
                  class="btn-close"
                  data-bs-dismiss="modal">
          </button>
        </div>
        <div class="modal-body">
          <!-- Скрытые поля -->
          <input type="hidden" id="transaction_cert_id">
          <input type="hidden" id="transaction_servicegroup_id">
          <!-- Баланс -->
          <div class="row mb-3">
            <div class="col-md-4">
              <label class="form-label">Текущий баланс</label>
              <input
                  type="text"
                  id="transaction_balance"
                  class="form-control"
                  disabled>
            </div>
          </div>
          <!-- Клиент -->
          <div class="mb-4">
            <label class="form-label">Клиент</label>
            <div class="d-flex gap-2">
              <select
                      id="transaction_client"
                      class="form-select"
                      required>
                <option value="">Выберите клиента...</option>
                {% for client in clients %}
                <option value="{{ client.id }}">
                  {{ client.name }}
                </option>
                {% endfor %}
              </select>
              <button
                      type="button"
                      id="transactionCreateClientBtn"
                      class="btn btn-outline-primary"
                      title="Создать клиента">
                <i class="bi bi-plus-lg"></i>
              </button>
            </div>
          </div>
          <!-- Позиции документа -->
          
          <div class="d-flex align-items-center gap-2">
              <label class="form-label mb-0">
                  Услуги 
              </label>

              <button
                  type="button"
                  class="icon-btn-ghost"
                  id="transactionAddItemBtn">
                  <i class="bi bi-plus-circle"></i>
              </button>
          </div>
          <div
            id="transactionItems"
            class="list-group mb-3">
            <div
              class="list-group-item text-center text-muted"
              id="transactionEmpty">
              Пока не добавлено ни одной услуги
            </div>
          </div>
          <!-- Итог -->
          <div class="row mb-4">
            <div class="col-md-4">
              <label class="form-label">
                Сумма транзакции
              </label>
              <input
                type="text"
                id="transactionAmount"
                class="form-control"
                value="0.00"
                disabled>
            </div>
            <div class="col-md-4">
              <label class="form-label">
                Остаток после списания
              </label>
              <input
                type="text"
                id="transactionRemaining"
                class="form-control"
                value="0.00"
                disabled>
            </div>
          </div>
          <!-- Комментарий -->
          <div class="mb-3">
            <label class="form-label">
              Комментарий
            </label>
            <textarea
                    id="transaction_comment"
                    class="form-control form-comment-auto"
                    maxlength="250">
            </textarea>
          </div>
        </div>
        <div class="modal-footer">
          <button
            type="button"
            class="btn btn-secondary"
            data-bs-dismiss="modal">
            Отмена
          </button>
          <button
            type="submit"
            class="btn btn-danger">
            Провести списание
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
