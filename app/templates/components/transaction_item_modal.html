<!-- /templates/components/transaction_item_modal.html -->

<div class="modal fade" id="transactionItemModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <form id="transactionItemForm">
                <div class="modal-header">
                    <h5 class="modal-title">
                        Добавление услуги
                    </h5>
                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal">
                    </button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label class="form-label">
                            Услуга
                        </label>
                        <select
                            id="transactionItemService"
                            class="form-select">
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">
                            Количество
                        </label>
                        <input
                            type="number"
                            id="transactionItemQuantity"
                            class="form-control"
                            value="1"
                            min="0.01"
                            step="0.01">
                    </div>
                    <div class="row">
                        <div class="col">
                            <label class="form-label">
                                Цена
                            </label>
                            <input
                                type="number"
                                id="transactionItemPrice"
                                class="form-control"
                                min="0"
                                step="0.01">
                        </div>
                        <div class="col">
                            <label class="form-label">
                                Сумма
                            </label>
                            <input
                                id="transactionItemAmount"
                                class="form-control"
                                disabled>
                        </div>
                    </div>
                </div>
                <div class="modal-footer">
                    <button
                        type="button"
                        class="btn btn-secondary"
                        data-bs-dismiss="modal">
                        Отмена
                    </button>
                    <button
                        type="submit"
                        class="btn btn-primary">
                        Добавить
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
